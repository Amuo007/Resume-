name: Build Resume PDF

# Push a change to resume.tex and this compiles it, commits the new
# resume.pdf, and tells the portfolio site to redeploy with it.
on:
  push:
    branches:
      - main
    paths:
      - "resume.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if git diff --cached --quiet; then
            echo "resume.pdf is unchanged - nothing to commit."
          else
            git commit -m "Rebuild resume.pdf from resume.tex"
            git push
            echo "Committed a freshly compiled resume.pdf."
          fi

      # Commits made with GITHUB_TOKEN do not start new workflow runs, and
      # the trigger above only watches resume.tex, so this cannot loop.
      - name: Trigger portfolio redeploy
        env:
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN is not set, so the site was not redeployed right now. It will pick up this resume on its next deploy or the daily 08:00 UTC rebuild. Add the secret for instant updates."
            exit 0
          fi

          code=$(curl -s -o /tmp/dispatch.log -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Amuo007/portfolio/dispatches \
            -d '{"event_type":"resume-updated"}')

          if [ "$code" = "204" ]; then
            echo "Portfolio redeploy triggered."
          else
            echo "::error::Could not trigger the portfolio redeploy (HTTP $code). The PDF built and committed fine - only the instant site update failed, most likely an expired or wrong-scoped PORTFOLIO_DISPATCH_TOKEN. The site still updates on its daily rebuild."
            cat /tmp/dispatch.log
            exit 1
          fi
